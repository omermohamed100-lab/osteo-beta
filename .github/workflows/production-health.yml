name: Production Health

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check production readiness
        run: |
          curl --fail --silent --show-error --retry 2 --retry-delay 5 \
            https://osteo-beta.vercel.app/api/health > health.json
          node -e "const h=require('./health.json'); if(h.checks?.database!=='available') process.exit(1); if(h.checks?.email!=='available') console.log('::warning::Email notifications are degraded; submissions remain available in admin messages.');"
